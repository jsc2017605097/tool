name: Build Windows app (làm sạch CCCD)

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        working-directory: desktop
        run: |
          pyinstaller --onefile --windowed --name LamSachCCCD --version-file version_info.txt clean_app.py

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamSachCCCD-windows
          path: desktop/dist/LamSachCCCD.exe
          retention-days: 90
